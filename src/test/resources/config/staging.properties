# Staging Environment Configuration

# API Base URL
api.base.url=https://api-staging.example.com
api.auth.url=https://api-staging.example.com

# Logging
logging.request.enabled=false
logging.response.enabled=false
logging.level=INFO

# Timeouts
api.connection.timeout=30000
api.socket.timeout=30000
api.response.timeout=30000

# Response Time
api.response.maxTime=3000

# Parallel Execution
parallel.thread.count=15
