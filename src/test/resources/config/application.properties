# Base Configuration - Shared across all environments

# API Configuration
api.connection.timeout=30000
api.socket.timeout=30000
api.response.timeout=30000

# Logging Configuration
logging.request.enabled=false
logging.response.enabled=false
logging.level=INFO

# Retry Configuration
retry.enabled=true
retry.max.attempts=3
retry.delay.ms=1000

# JIRA Configuration
jira.auto.create=true
jira.duplicate.check=true
jira.update.existing=true
jira.project.key=API

# Parallel Execution
parallel.thread.count=10
parallel.mode=methods

# Response Time Thresholds (ms)
api.response.maxTime=2000
