# QA Environment Configuration

# API Base URL
api.base.url=https://jsonplaceholder.typicode.com/
api.auth.url=https://jsonplaceholder.typicode.com/

# Logging (minimal for faster execution)
logging.request.enabled=true
logging.response.enabled=true
logging.level=INFO

# Timeouts
api.connection.timeout=30000
api.socket.timeout=30000
api.response.timeout=30000

# Response Time
api.response.maxTime=2000

# Parallel Execution
parallel.thread.count=10
