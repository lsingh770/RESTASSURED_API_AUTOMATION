# QA Environment Configuration

# API Base URL
api.base.url=https://api-qa.example.com
api.auth.url=https://api-qa.example.com

# Logging (minimal for faster execution)
logging.request.enabled=false
logging.response.enabled=false
logging.level=INFO

# Timeouts
api.connection.timeout=30000
api.socket.timeout=30000
api.response.timeout=30000

# Response Time
api.response.maxTime=2000

# Parallel Execution
parallel.thread.count=10
